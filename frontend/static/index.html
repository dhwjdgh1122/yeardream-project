<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YearDream Ad Detector</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f5f7fb;
        color: #1f2937;
      }
      .container {
        max-width: 900px;
        margin: 40px auto;
        padding: 24px;
      }
      .card {
        background: white;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      }
      input, button {
        font-size: 16px;
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid #d1d5db;
      }
      button {
        cursor: pointer;
        background: #2563eb;
        color: white;
        border: none;
      }
      .result {
        margin-top: 20px;
        white-space: pre-wrap;
        background: #111827;
        color: #f9fafb;
        padding: 18px;
        border-radius: 8px;
        overflow: auto;
      }
      .row {
        display: flex;
        gap: 12px;
      }
      .status {
        margin-top: 12px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>불법광고 탐지 도구</h1>
        <div class="row">
          <input id="url" type="text" value="https://example.com" style="flex: 1;" />
          <select id="techniqueFilter" style="min-width: 180px;">
            <option value="ALL">전체 유형</option>
            <option value="HOMOGLYPH">HOMOGLYPH</option>
            <option value="JAMO">JAMO</option>
            <option value="TRANSPARENT">TRANSPARENT</option>
            <option value="OFFSCREEN">OFFSCREEN</option>
          </select>
          <button id="analyze">탐지 실행</button>
        </div>
        <div class="status" id="status">대기 중</div>
        <div class="result" id="output">결과가 여기에 표시됩니다.</div>
      </div>
    </div>

    <script>
      const urlInput = document.getElementById('url');
      const output = document.getElementById('output');
      const status = document.getElementById('status');
      const techniqueFilter = document.getElementById('techniqueFilter');
      const analyzeButton = document.getElementById('analyze');
      let lastAnalysis = null;

      function renderFindings(data) {
        const filter = techniqueFilter.value;
        const findings = data.findings.filter((item) => filter === 'ALL' || item.technique === filter);

        const summary = {
          url: data.url,
          pageTitle: data.page_title || 'N/A',
          totalPages: data.crawled_pages.length,
          totalFindings: findings.length,
          warnings: data.warnings || [],
          findings: findings.map((item) => ({
            technique: item.technique,
            selector: item.selector,
            location: item.location,
            evidence: item.evidence,
            confidence: item.confidence
          }))
        };

        output.textContent = JSON.stringify(summary, null, 2);
      }

      analyzeButton.addEventListener('click', async () => {
        const url = urlInput.value.trim();
        if (!url) {
          status.textContent = 'URL을 입력해 주세요.';
          return;
        }

        lastAnalysis = null;
        analyzeButton.disabled = true;
        status.textContent = '탐지 중...';
        output.textContent = '요청을 보냈습니다.';

        try {
          const response = await fetch('/api/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url })
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.detail || '분석 실패');
          }

          lastAnalysis = data;
          renderFindings(lastAnalysis);
          const completion = data.warnings?.length ? '분석 완료(일부 범위 미분석)' : '분석 완료';
          status.textContent = `${completion}: ${data.findings.length}개 탐지 결과`;
        } catch (error) {
          output.textContent = error.message;
          status.textContent = '오류 발생';
        } finally {
          analyzeButton.disabled = false;
        }
      });

      techniqueFilter.addEventListener('change', () => {
        if (lastAnalysis) {
          renderFindings(lastAnalysis);
        }
      });
    </script>
  </body>
</html>
