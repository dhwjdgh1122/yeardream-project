<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>탐지 특징 정답 페이지</title></head>
<body>
  <section>
    <p id="homoglyph">ｅxample 광고</p>
    <p id="jamo">ㅈㅏㅁㅗ 광고</p>
    <p id="transparent" style="color: transparent">숨김 광고</p>
    <p id="opacity-zero" style="opacity:0.00">투명 광고</p>
    <p id="offscreen" style="position:absolute;left:-9999px">화면 밖 광고</p>
    <p id="second-offscreen" style="position:fixed;top:-9999px">다른 화면 밖 광고</p>
    <p id="tiny" style="font-size:1px">작은 광고</p>
    <p id="display-none" style="display:none">표시하지 않는 광고</p>
    <p id="combined" style="opacity:0">ㅈㅏㅁㅗ 광고</p>
    <div style="opacity:0"><span id="inherited-opacity">부모 투명 광고</span></div>
    <p id="important" style="opacity:0 !important;opacity:0.5">중요 선언</p>
  </section>
</body></html>
